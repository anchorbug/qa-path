<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA Supply · Учебный магазин</title><link rel="stylesheet" href="/style.css"></head><body><main style="max-width:850px;margin:40px auto"><a class="brand" href="/">QA Supply <span style="font-size:12px;margin-left:15px;color:#78818e">Учебный стенд</span></a><p class="muted" style="margin:20px 0 35px">Все товары и действия учебные. Никаких покупок или платежей.</p><div class="card"><div class="section-label">Для тех, кто находит баги</div><h1>QA Notebook</h1><p>Блокнот для тестовых идей, граничных значений и неожиданных открытий.</p><h2>500 GEL</h2><button class="primary" id="add">Добавить блокнот</button></div><div class="card"><h2>Корзина</h2><p id="empty">Пока пусто</p><div id="cart" hidden><label for="quantity">Количество</label><input id="quantity" type="number" min="1" max="99" value="1" style="margin:15px;padding:10px;width:90px"><p id="validation" role="alert"></p><p>Итого: <strong data-testid="total">500</strong> GEL</p><button class="secondary" id="clear">Очистить корзину</button></div></div><a href="/shop/api/products">Посмотреть JSON каталога →</a> · <a href="/">Вернуться к курсу</a><script>const qty=document.querySelector('#quantity'),total=document.querySelector('[data-testid="total"]');document.querySelector('#add').onclick=()=>{document.querySelector('#empty').hidden=true;document.querySelector('#cart').hidden=false;qty.value='1';total.textContent='500';document.querySelector('#validation').textContent='';};qty.oninput=()=>{const n=Number(qty.value),valid=Number.isInteger(n)&&n>=1&&n<=99;document.querySelector('#validation').textContent=valid?'':'Введи целое количество от 1 до 99.';total.textContent=valid?String(500*n):'—';};document.querySelector('#clear').onclick=()=>{document.querySelector('#empty').hidden=false;document.querySelector('#cart').hidden=true;};</script></main></body></html>
