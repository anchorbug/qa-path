name: Real API and browser examples
on: [push, pull_request]
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest examples -v --browser chromium --tracing retain-on-failure --screenshot only-on-failure --junitxml=results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: example-results
          path: |
            results.xml
            test-results/
